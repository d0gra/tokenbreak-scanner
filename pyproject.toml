[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenbreak-scanner"
version = "0.1.12"
description = "TokenBreak Scanner — Detect BPE & WordPiece tokenizer vulnerabilities in LLMs and text classifiers. Scan any HuggingFace model for TokenBreak adversarial attacks before fine-tuning or deployment. AI supply chain security for GPT, LLaMA, Mistral, Qwen, BERT, and more."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "AGPL-3.0-or-later" }
authors = [
    { name = "TokenBreak Scanner Contributors" },
]
keywords = [
    "tokenbreak",
    "tokenbreak-attack",
    "tokenbreak-scanner",
    "tokenizer-vulnerability",
    "tokenizer-security",
    "tokenizer-audit",
    "llm-security",
    "llm-vulnerability",
    "llm-guardrails",
    "llm-safety",
    "adversarial-attack",
    "adversarial-nlp",
    "prompt-injection",
    "prompt-injection-bypass",
    "jailbreak-detection",
    "content-moderation-bypass",
    "text-classification-attack",
    "ai-security",
    "ai-safety",
    "ai-supply-chain",
    "ai-red-team",
    "model-auditing",
    "model-evaluation",
    "model-selection",
    "bpe",
    "bpe-vulnerability",
    "wordpiece",
    "unigram",
    "sentencepiece",
    "huggingface",
    "transformers",
    "nlp-security",
    "vulnerability-scanner",
    "finetuning",
    "mlops",
    "mlsec",
    "owasp-llm",
    "gpt-security",
    "llama-security",
    "mistral-security",
    "bert-security",
    "qwen-security",
    "gemma-security",
    "guardrail-bypass",
    "classifier-evasion",
    "toxicity-bypass",
    "spam-filter-bypass",
    "open-source-models",
    "model-scanning",
    "ci-cd-security",
    "devsecops",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Security :: Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = [
    "transformers>=4.40.0",
    "tokenizers>=0.19.0",
    "sentencepiece>=0.1.99",
    "tiktoken>=0.5.0",
    "pydantic>=2.0.0",
    "click>=8.0.0",
    "rich>=13.0.0",
    "numpy>=1.17",
]

[project.optional-dependencies]
attack = [
    "torch>=2.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-timeout>=2.0.0",
    "httpx>=0.24.0",
]

[project.scripts]
tokenbreak-scan = "tokenbreak_scanner.cli:main"

[project.urls]
Homepage = "https://d0gra.github.io/tokenbreak-scanner/"
Repository = "https://github.com/d0gra/tokenbreak-scanner"
Documentation = "https://github.com/d0gra/tokenbreak-scanner#readme"
"Bug Tracker" = "https://github.com/d0gra/tokenbreak-scanner/issues"
Changelog = "https://github.com/d0gra/tokenbreak-scanner/releases"
"Research Paper" = "https://arxiv.org/html/2506.07948v1"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
markers = [
    "integration: tests that download and scan real HuggingFace models",
]
