[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenbreak-scanner"
version = "0.1.8"
description = "Detect TokenBreak adversarial vulnerabilities in LLMs, classifiers, and encoders. Audit HuggingFace and custom tokenizer artifacts for BPE/WordPiece attack surface in the AI supply chain."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "AGPL-3.0-or-later" }
authors = [
    { name = "TokenBreak Scanner Contributors" },
]
keywords = [
    "tokenbreak",
    "adversarial-attack",
    "nlp-security",
    "tokenizer",
    "vulnerability-scanner",
    "bpe",
    "wordpiece",
    "unigram",
    "sentencepiece",
    "huggingface",
    "transformers",
    "llm-security",
    "model-auditing",
    "red-teaming",
    "ai-safety",
    "mlops",
    "content-moderation",
    "guardrails",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "transformers>=4.40.0",
    "tokenizers>=0.19.0",
    "pydantic>=2.0.0",
    "click>=8.0.0",
    "rich>=13.0.0",
    "numpy>=1.17",
]

[project.optional-dependencies]
attack = [
    "torch>=2.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-timeout>=2.0.0",
    "httpx>=0.24.0",
]

[project.scripts]
tokenbreak-scan = "tokenbreak_scanner.cli:main"

[project.urls]
Homepage = "https://github.com/d0gra/tokenbreak-scanner"
Repository = "https://github.com/d0gra/tokenbreak-scanner"
Documentation = "https://github.com/d0gra/tokenbreak-scanner#readme"
Issues = "https://github.com/d0gra/tokenbreak-scanner/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
